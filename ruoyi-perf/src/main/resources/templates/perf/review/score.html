<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('绩效评分')" />
	<th:block th:include="perf/appraisal/info :: appraisalCss" />
</head>
<body class="gray-bg">
	<div class="main-content">
		<form id="form-review-score" class="form-horizontal">
			<input type="hidden" id="appraisalId" name="appraisalId" th:value="${appraisal.appraisalId}">
			<h4 class="form-header h4">考核信息</h4>
			<div th:replace="~{perf/appraisal/info :: appraisalSummary}"></div>

			<h4 class="form-header h4">指标评分 <small>每项按 0-100 分打分，自评得分：<b th:text="${appraisal.selfScore}"></b>，加权上级评分：<b id="weightedScore">0.00</b>，预计最终得分：<b id="finalScore">0.00</b></small></h4>
			<table class="table table-bordered perf-items">
				<thead>
					<tr>
						<th class="text-center" style="width:50px;">序号</th>
						<th style="width:140px;">指标名称</th>
						<th class="text-center" style="width:90px;">指标类型</th>
						<th>评分标准</th>
						<th class="text-center" style="width:70px;">权重</th>
						<th class="text-center" style="width:80px;">自评分</th>
						<th class="text-center" style="width:130px;">上级评分</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item, stat : ${appraisal.items}">
						<td class="text-center" th:text="${stat.count}"></td>
						<td th:text="${item.indicatorName}"></td>
						<td class="text-center" th:text="${@dict.getLabel('perf_indicator_type', item.indicatorType)}"></td>
						<td class="text-muted" th:text="${item.scoringStandard}"></td>
						<td class="text-center" th:text="${item.weight} + '%'"></td>
						<td class="text-center" th:text="${item.selfScore}"></td>
						<td class="text-center">
							<input type="hidden" th:name="'items[' + ${stat.index} + '].itemId'" th:value="${item.itemId}">
							<input class="form-control input-sm perf-score-input item-score" type="number" min="0" max="100" step="0.5"
								th:name="'items[' + ${stat.index} + '].leaderScore'" th:value="${item.leaderScore}" th:attr="data-weight=${item.weight},data-name=${item.indicatorName}">
						</td>
					</tr>
				</tbody>
			</table>

			<h4 class="form-header h4">评价</h4>
			<div class="form-group">
				<label class="col-sm-2 control-label">员工自评总结：</label>
				<div class="col-sm-10 form-control-static perf-comment" th:text="${#strings.isEmpty(appraisal.selfComment) ? '暂无' : appraisal.selfComment}"></div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">上级评语：</label>
				<div class="col-sm-10">
					<textarea name="leaderComment" id="leaderComment" class="form-control" rows="5" maxlength="1000" placeholder="对员工本考核期的表现进行评价，并给出改进建议"></textarea>
				</div>
			</div>
		</form>
	</div>

	<div class="row">
		<div class="col-sm-offset-5 col-sm-10">
			<button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>提交评分</button>&nbsp;
			<button type="button" class="btn btn-sm btn-warning" onclick="reject()"><i class="fa fa-undo"></i>退回自评</button>&nbsp;
			<button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭 </button>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "perf/review";
		var selfScore = [[${appraisal.selfScore}]] || 0;
		var selfWeight = [[${appraisal.selfWeight}]];

		$(function() {
			refreshScore();
			$(".item-score").on("input change", refreshScore);
		});

		/* 实时计算加权得分与预计最终得分 */
		function refreshScore() {
			var total = 0;
			$(".item-score").each(function() {
				var score = parseFloat($(this).val());
				if (!isNaN(score)) {
					total += score * $(this).data("weight") / 100;
				}
			});
			$("#weightedScore").text(total.toFixed(2));
			$("#finalScore").text(((selfScore * selfWeight + total * (100 - selfWeight)) / 100).toFixed(2));
		}

		function checkScores() {
			var valid = true;
			$(".item-score").each(function() {
				var value = $.common.trim($(this).val());
				var name = $(this).data("name");
				var score = Number(value);
				if (value == "") {
					$.modal.alertWarning("请填写指标「" + name + "」的分数");
				} else if (isNaN(score) || score < 0 || score > 100 || !/^\d+(\.\d{1,2})?$/.test(value)) {
					$.modal.alertWarning("指标「" + name + "」的分数必须是0到100之间的数字，最多两位小数");
				} else {
					return true;
				}
				$(this).focus();
				valid = false;
				return false;
			});
			return valid;
		}

		function submitHandler() {
			if (!checkScores()) {
				return;
			}
			if ($.common.isEmpty($.common.trim($("#leaderComment").val()))) {
				$.modal.alertWarning("请填写上级评语");
				$("#leaderComment").focus();
				return;
			}
			$.modal.confirm("预计最终得分 " + $("#finalScore").text() + "，提交后考核完成且无法修改，确认提交吗？", function() {
				$.operate.saveTab(prefix + "/score", $("#form-review-score").serialize());
			});
		}

		/* 退回员工重新自评 */
		function reject() {
			top.layer.prompt({ formType: 2, title: "请输入退回原因", maxlength: 500, area: ['400px', '120px'] }, function(value, index) {
				if ($.common.isEmpty($.common.trim(value))) {
					top.layer.msg("请输入退回原因");
					return;
				}
				top.layer.close(index);
				$.operate.saveTab(prefix + "/reject", { "appraisalId": $("#appraisalId").val(), "reason": value });
			});
		}
	</script>
</body>
</html>
