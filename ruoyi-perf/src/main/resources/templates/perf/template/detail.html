<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('考核模板详细')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m-t" th:object="${template}">
			<div class="form-group">
				<label class="col-sm-2 control-label">模板名称：</label>
				<div class="form-control-static col-sm-4" th:text="*{templateName}"></div>
				<label class="col-sm-2 control-label">状态：</label>
				<div class="form-control-static col-sm-4" th:text="${@dict.getLabel('sys_normal_disable', template.status)}"></div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">备注：</label>
				<div class="form-control-static col-sm-10" th:text="*{remark}"></div>
			</div>
		</form>
		<table class="table table-bordered table-striped">
			<thead>
				<tr>
					<th style="width:60px;" class="text-center">序号</th>
					<th>指标名称</th>
					<th class="text-center" style="width:100px;">指标类型</th>
					<th>评分标准</th>
					<th class="text-center" style="width:100px;">权重</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item, stat : ${template.items}">
					<td class="text-center" th:text="${stat.count}"></td>
					<td th:text="${item.indicatorName}"></td>
					<td class="text-center" th:text="${@dict.getLabel('perf_indicator_type', item.indicatorType)}"></td>
					<td th:text="${item.scoringStandard}"></td>
					<td class="text-center" th:text="${item.weight} + '%'"></td>
				</tr>
			</tbody>
		</table>
	</div>
	<th:block th:include="include :: footer" />
</body>
</html>
