<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('发布考核计划')" />
	<th:block th:include="include :: ztree-css" />
	<th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-plan-publish" th:object="${plan}">
			<input id="planId" name="planId" type="hidden" th:field="*{planId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label">计划名称：</label>
				<div class="col-sm-8">
					<div class="form-control-static" th:text="*{planName}"></div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">考核模板：</label>
				<div class="col-sm-8">
					<div class="form-control-static">
						<span th:text="*{templateName}"></span>
						<span class="text-muted" th:text="'（自评权重 ' + *{selfWeight} + '%，考核期间 ' + *{#dates.format(startDate, 'yyyy-MM-dd')} + ' ~ ' + *{#dates.format(endDate, 'yyyy-MM-dd')} + '）'"></span>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">参与部门：</label>
				<div class="col-sm-8">
					<label class="check-box">
						<input type="checkbox" value="1" checked>展开/折叠</label>
					<label class="check-box">
						<input type="checkbox" value="2">全选/全不选</label>
					<div id="deptTrees" class="ztree ztree-border"></div>
					<span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 将为所选部门下所有正常状态的员工生成考核单，勾选上级部门会自动包含下级部门</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">评分规则：</label>
				<div class="col-sm-8">
					<label class="check-box">
						<input type="checkbox" id="useDeptLeader" name="useDeptLeader" value="true" checked>优先由部门负责人评分</label>
					<span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 按部门的「负责人」姓名匹配系统用户；匹配不到或负责人是本人时，由默认评分人评分</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">默认评分人：</label>
				<div class="col-sm-8">
					<select id="reviewerId" name="reviewerId" class="form-control" required>
						<option value="">请选择默认评分人</option>
						<option th:each="u : ${users}" th:value="${u.userId}" th:selected="${u.userId == loginUserId}"
							th:text="${u.userName} + '（' + ${u.loginName} + (${u.dept != null and u.dept.deptName != null} ? ' / ' + ${u.dept.deptName} : '') + '）'"></option>
					</select>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: ztree-js" />
	<th:block th:include="include :: select2-js" />
	<script type="text/javascript">
		var prefix = ctx + "perf/plan";

		$(function() {
			var options = {
				id: "deptTrees",
				url: prefix + "/deptTreeData",
				check: { enable: true, nocheckInherit: true, chkboxType: { "Y": "ps", "N": "ps" } },
				expandLevel: 2
			};
			$.tree.init(options);
		});

		$('input').on('ifChanged', function(obj){
			var type = $(this).val();
			var checked = obj.currentTarget.checked;
			if (type == "1") {
				$._tree.expandAll(checked);
			} else if (type == "2") {
				$._tree.checkAllNodes(checked);
			}
		});

		function submitHandler() {
			if ($.validate.form()) {
				var deptIds = $.tree.getCheckedNodes();
				if ($.common.isEmpty(deptIds)) {
					$.modal.alertWarning("请选择参与考核的部门");
					return;
				}
				var data = {
					"planId": $("#planId").val(),
					"deptIds": deptIds,
					"reviewerId": $("#reviewerId").val(),
					"useDeptLeader": $("#useDeptLeader").is(":checked")
				};
				$.modal.confirm("发布后将生成员工考核单，计划信息不可再修改，确认发布吗？", function() {
					$.operate.save(prefix + "/publish", data);
				});
			}
		}
	</script>
</body>
</html>
