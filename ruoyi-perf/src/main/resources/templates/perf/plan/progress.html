<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('考核进度')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="progress-form">
					<input type="hidden" name="planId" th:value="${plan.planId}">
					<div class="select-list">
						<ul>
							<li>
								<b th:text="${plan.planName}"></b>
								<span th:text="${@dict.getLabel('perf_plan_status', plan.planStatus)}" class="badge badge-primary"></span>
								&nbsp;&nbsp;
							</li>
							<li>
								员工：<input type="text" name="userName" placeholder="姓名或登录账号"/>
							</li>
							<li>
								考核状态：<select name="appraisalStatus" th:with="type=${@dict.getType('perf_appraisal_status')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var editFlag = [[${@permission.hasPermi('perf:plan:edit')}]];
		var planRunning = [[${plan.planStatus == '1'}]];
		var statusDatas = [[${@dict.getType('perf_appraisal_status')}]];
		var gradeDatas = [[${@dict.getType('perf_grade')}]];
		var prefix = ctx + "perf/plan";

		$(function() {
			var options = {
				url: prefix + "/progress/list",
				detailUrl: prefix + "/appraisal/{id}",
				modalName: "考核单",
				showSearch: false,
				columns: [
				{
					field: 'userName',
					title: '员工姓名'
				},
				{
					field: 'loginName',
					title: '登录账号'
				},
				{
					field: 'deptName',
					title: '部门'
				},
				{
					field: 'reviewerName',
					title: '评分人'
				},
				{
					field: 'appraisalStatus',
					title: '考核状态',
					align: 'center',
					formatter: function(value, row, index) {
						return $.table.selectDictLabel(statusDatas, value);
					}
				},
				{
					field: 'selfScore',
					title: '自评得分',
					align: 'center'
				},
				{
					field: 'leaderScore',
					title: '上级评分',
					align: 'center'
				},
				{
					field: 'finalScore',
					title: '最终得分',
					align: 'center'
				},
				{
					field: 'grade',
					title: '等级',
					align: 'center',
					formatter: function(value, row, index) {
						return $.table.selectDictLabel(gradeDatas, value);
					}
				},
				{
					title: '操作',
					align: 'center',
					formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.appraisalId + '\', 1000)"><i class="fa fa-search"></i>详细</a> ');
						if (planRunning && row.appraisalStatus != '2') {
							actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="changeReviewer(\'' + row.appraisalId + '\')"><i class="fa fa-exchange"></i>更换评分人</a> ');
							actions.push('<a class="btn btn-danger btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="removeAppraisal(\'' + row.appraisalId + '\', \'' + $.common.escapeHtml(row.userName) + '\')"><i class="fa fa-remove"></i>移除</a>');
						}
						return actions.join('');
					}
				}]
			};
			$.table.init(options);
		});

		/* 更换评分人 */
		function changeReviewer(appraisalId) {
			$.modal.open("更换评分人", prefix + "/changeReviewer/" + appraisalId, 600, 360);
		}

		/* 移除考核单 */
		function removeAppraisal(appraisalId, userName) {
			$.modal.confirm("确认将「" + userName + "」移出本次考核吗？其考核单和已填写的评分将被删除。", function() {
				$.operate.post(prefix + "/removeAppraisal", { "appraisalId": appraisalId });
			});
		}
	</script>
</body>
</html>
