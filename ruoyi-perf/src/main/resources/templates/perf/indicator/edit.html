<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改考核指标')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-indicator-edit" th:object="${indicator}">
			<input id="indicatorId" name="indicatorId" type="hidden" th:field="*{indicatorId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">指标名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="indicatorName" id="indicatorName" th:field="*{indicatorName}" maxlength="100" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">指标类型：</label>
				<div class="col-sm-8">
					<select name="indicatorType" class="form-control" th:with="type=${@dict.getType('perf_indicator_type')}" required>
						<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{indicatorType}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">评分标准：</label>
				<div class="col-sm-8">
					<textarea name="scoringStandard" class="form-control" rows="4" maxlength="500" placeholder="描述各分数段的评判标准，员工自评和上级评分时可见">[[*{scoringStandard}]]</textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" th:field="*{orderNum}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control" maxlength="500">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "perf/indicator";

		$("#form-indicator-edit").validate({
			onkeyup: false,
			rules:{
				indicatorName:{
					remote: {
						url: prefix + "/checkIndicatorNameUnique",
						type: "post",
						dataType: "json",
						data: {
							"indicatorId": function() {
								return $("#indicatorId").val();
							},
							"indicatorName" : function() {
								return $.common.trim($("#indicatorName").val());
							}
						}
					}
				},
				orderNum:{
					digits:true
				}
			},
			messages: {
				"indicatorName": {
					remote: "指标名称已经存在"
				}
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-indicator-edit').serialize());
			}
		}
	</script>
</body>
</html>
